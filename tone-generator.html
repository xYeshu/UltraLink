<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tone generator — UltraLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a href="/" class="brand"><span class="mark"></span>UltraLink</a>
      <div class="sub"><a href="/" class="back-link">Back to menu</a></div>
    </div>
    <div class="mode-label">Tone generator</div>
  </header>

  <div class="intro">
    <h2>Test tone.</h2>
    <p>Use this to verify frequency detection on a receiver. Sweep across the band the modem uses, then watch the detector respond.</p>
  </div>

  <section>
    <div class="section-head"><span class="section-title">Frequency</span></div>
    <label for="freqInput">Hz <span class="val-inline" id="freqDisp">18500</span></label>
    <input type="range" id="freqInput" min="17000" max="21000" step="10" value="18500">

    <div class="btnrow" style="margin-top:20px;">
      <button class="primary action-btn" id="playBtn">Play tone</button>
      <button class="danger action-btn" id="stopBtn" disabled>Stop</button>
    </div>
  </section>

</div>
<script src="main.js" defer></script>
</body>
</html>
