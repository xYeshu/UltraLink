<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SENDER · UltraLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background-effects">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1><span class="logo-icon">⚡</span> UltraLink</h1>
      <div class="sub">Acoustic FSK data link — <a href="/" class="text-link">back to menu</a></div>
    </div>
    <div class="clock">MODE<br><b>▲ SENDER</b></div>
  </header>

  <!-- TRANSMITTER -->
  <div class="panel" data-tag="TRANSMITTER">
    <label for="txText">MESSAGE</label>
    <div class="input-group">
      <input type="text" id="txText" placeholder="Hello" value="Hello" maxlength="64">
    </div>
    <div class="btnrow" style="margin-top:16px;">
      <button class="primary action-btn" id="sendBtn">▲ SEND MESSAGE</button>
    </div>
    <div class="readout" style="margin-top:20px;">
      <span class="k">PACKET LENGTH</span>
      <span class="v" id="txLen">0 bytes</span>
    </div>
    <div class="readout">
      <span class="k">CHECKSUM (XOR)</span>
      <span class="v" id="txChecksum">—</span>
    </div>
    <label style="margin-top:20px;">FULL BIT STREAM</label>
    <div class="bitstream" id="txBits">—</div>
    <div class="hint">Preamble · start · length · data · checksum · end — each bit held for 100ms.</div>
  </div>

  <div class="panel" data-tag="LOG">
    <label>EVENT LOG</label>
    <div class="log" id="eventLog"></div>
  </div>

</div>
<script src="main.js" defer></script>
</body>
</html>
